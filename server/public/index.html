:root{
  --bg:#0D0D0E; --surface:#161618; --surface2:#1F1F22; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --ink:#F4F2EE; --muted:#B0ACA8; --faint:#8E8A86; --gold:#C8B08A; --gold-ink:#1A140C;
  --ok:#7FC79A; --bad:#E08A80;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --thin:"Comfortaa","Montserrat",system-ui,sans-serif; --body:"Montserrat",system-ui,sans-serif; --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#050506}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;transition:transform .12s ease,opacity .12s ease,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold);text-decoration:none}
input,textarea{font:inherit}
img{display:block}
.ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06) brightness(.82)}
.app{position:relative;max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:calc(100px + env(safe-area-inset-bottom));box-shadow:0 0 60px rgba(0,0,0,.6)}
.brand-top{font-family:var(--thin);font-weight:300;letter-spacing:.06em}
.brand{font-family:var(--serif);font-weight:600;letter-spacing:.04em}
.caps{font-family:var(--thin);font-weight:300;text-transform:uppercase;letter-spacing:.08em}

/* шапка */
.hero{position:relative;height:340px;background:#000;overflow:hidden}
.hero-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.hero-track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:var(--ink)}
.slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.75) 100%)}
.slide .cap{position:absolute;left:116px;bottom:96px;font-family:var(--thin);font-size:15px;letter-spacing:.04em}
.cover{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 90px}
.cover .bt{font-size:18px}
.cover .bn{font-size:48px;line-height:1;margin-top:2px}
.cover .rule{width:120px;height:1px;background:var(--line2);margin:18px 0 14px}
.cover .tl{font-family:var(--thin);font-size:13px;color:var(--muted);letter-spacing:.04em;max-width:300px;line-height:1.6}
.cover .ghost{position:absolute;inset:0;opacity:.28}
.hero-ui{position:absolute;inset:0;pointer-events:none}
.hero-ui>*{pointer-events:auto}
.dots{position:absolute;left:16px;right:16px;bottom:44px;display:flex;gap:4px;pointer-events:none}
.dots span{flex:1;height:2px;border-radius:1px;background:#fff;opacity:.3;transition:opacity .2s}
.dots span.on{opacity:1}
.logo-tile{position:absolute;left:16px;bottom:64px;width:86px;height:86px;border-radius:20px;background:#000;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.logo-tile .bt{font-size:8.5px;color:var(--muted)}
.logo-tile .bn{font-size:14px;margin-top:2px}
.photo-count{position:absolute;right:16px;bottom:76px;color:#fff;font-size:13px;font-weight:500;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.hero-badge{position:absolute;top:16px;left:16px;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px}
.arrow{position:absolute;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--line2);color:#fff;display:none;align-items:center;justify-content:center}
.arrow.l{right:58px}.arrow.r{right:14px}
@media (hover:hover){.hero:hover .arrow{display:flex}}

/* шторка */
.sheet{position:relative;margin-top:-24px;background:var(--surface);border-radius:24px 24px 0 0}
.grab{display:flex;justify-content:center;padding-top:8px}
.grab span{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.head{padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.title-row{display:flex;align-items:flex-start;gap:10px}
.title-row h1{flex:1;margin:0;font-family:var(--thin);font-size:30px;font-weight:400;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.verified{width:16px;height:16px;border-radius:50%;background:var(--gold);display:inline-flex;align-items:center;justify-content:center}
.round{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.cats{color:var(--muted);font-size:14.5px}
.rating{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px}
.rating .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);padding:4px 10px;border-radius:999px;font-weight:600}
.rating button{color:var(--muted)}
.status{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px}
.status .open{display:flex;align-items:center;gap:8px;font-weight:500}
.status .dot{width:7px;height:7px;border-radius:50%}
.status .far{color:var(--muted)}
.promo{padding:16px 16px 0;display:flex;flex-direction:column;gap:14px}
.promo-line{display:flex;gap:12px;font-size:15px;line-height:1.4}
.promo-line .star{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px;font-size:13px}
.promo-line small{display:block;color:var(--faint);font-size:12px;margin-top:4px}
.btn-main{height:54px;border-radius:var(--r-md);background:var(--ink);color:#0D0D0E;font-size:16px;font-weight:600;width:100%;letter-spacing:.01em}

.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-top:16px}
.tabs-row{display:flex;gap:24px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tabs-row::-webkit-scrollbar{display:none}
.tab{flex:none;padding:15px 0 11px;border-bottom:2px solid transparent;font-size:15.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--gold)}
.count{font-size:12px;border:1px solid var(--line);color:var(--faint);padding:1px 7px;border-radius:8px}

.stack{display:flex;flex-direction:column;gap:8px;background:var(--bg);padding-top:8px}
.sec{background:var(--surface);padding:20px 16px}
.sec.flush{padding-left:0;padding-right:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 14px}
.sec.flush .sec-h{padding:0 16px}
.sec-h h2{margin:0;font-family:var(--thin);font-weight:400;font-size:19px;letter-spacing:.01em}
.link{color:var(--gold);font-size:14px;font-weight:500}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-padding-inline:16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps3 div{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:6px}
.steps3 b{font-family:var(--thin);font-weight:300;font-size:22px;color:var(--gold)}
.steps3 span{font-size:13px;line-height:1.35;color:var(--muted)}

.offer{position:relative;overflow:hidden;border-radius:var(--r-lg);background:#000;padding:22px 20px;display:flex;flex-direction:column;gap:12px;min-height:320px;justify-content:flex-end}
.offer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.92) 100%)}
.offer>*:not(img){position:relative;z-index:1}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--gold);color:var(--gold-ink)}
.badge.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.offer h3{margin:0;font-family:var(--thin);font-weight:400;font-size:25px;line-height:1.2}
.offer p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.offer .price{display:flex;align-items:baseline;gap:12px}
.offer .price b{font-family:var(--thin);font-weight:400;font-size:30px}
.offer .price s{font-size:15px;color:var(--faint)}

.story-th{flex:none;width:108px;display:flex;flex-direction:column;gap:7px;text-align:left}
.story-th .rg{display:block;padding:2px;border-radius:18px;border:1.5px solid var(--gold)}
.story-th .cv{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;height:136px;border-radius:14px;padding:10px;background:#222;overflow:hidden}
.story-th .cv::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%);z-index:1}
.story-th .cv b{position:relative;z-index:2;font-family:var(--thin);font-weight:600;font-size:13px;line-height:1.2}
.story-th strong{font-size:13.5px;font-weight:500}

/* прайс-строки как в печатном прайсе */
.price-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.price-row .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.price-row .nm span{font-size:15px;line-height:1.3}
.price-row .nm small{font-size:12.5px;color:var(--faint)}
.price-row .lead{flex:0 1 40px;min-width:16px;height:1px;background:var(--line2);align-self:center}
.price-row .pr{white-space:nowrap;font-family:var(--thin);font-size:15px;text-align:right}
.price-row .pr s{display:block;font-family:var(--body);font-size:12px;color:var(--faint)}
.add{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.add[aria-pressed=true]{background:var(--ink);color:#0D0D0E;border-color:var(--ink)}

.svc{flex:none;width:156px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.svc .img{position:relative;height:118px;background:#222;overflow:hidden}
.svc .img .badge{position:absolute;top:8px;left:8px;z-index:1}
.svc .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.svc .nm{font-size:13.5px;line-height:1.3;height:36px;overflow:hidden}
.svc .row{display:flex;align-items:center;justify-content:space-between;gap:6px}

  $('story').innerHTML = '<div class="story-in">' + (s.photo ? '<img src="' + esc(photoUrl(s.photo, 900)) + '" alt="" onerror="this.remove()">' : '') + '<span class="veil"></span>' +
    '<div class="story-bars">' + DATA.stories.map((_, j) => '<span class="' + (j < i ? 'sb-done' : j === i ? 'sb-cur' : '') + '"><i></i></span>').join('') + '</div>' +
    '<div class="story-top"><span class="av">E</span><span class="who"><b>' + esc(S.name) + '</b><small>' + esc(s.caption) + '</small></span><button class="story-x" data-a="storyClose" aria-label="Закрыть историю">' + I.x + '</button></div>' +
    '<div class="story-body"><button class="zone" style="left:0;width:35%" data-a="storyPrev" aria-label="Предыдущая"></button><button class="zone" style="right:0;width:65%" data-a="storyNext" aria-label="Следующая"></button>' +
    '<div class="story-txt"><span class="k">' + esc(s.kicker) + '</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p>' +
    (s.lines ? '<div class="slines">' + s.lines.map((l) => '<div><span>' + esc(l[0]) + '</span><i></i><b>' + esc(l[1]) + '</b></div>').join('') + '</div>' : '') + '</div></div>' +

function closeStory() { clearTimeout(storyTimer); st.story = -1; $('story').classList.remove('on'); if (!st.bk) document.body.style.overflow = ''; }

function openBooking(enter) {
  closeStory();
  st.bk = st.bk || { step: 1, day: 0, win: null, contact: null, sent: false };
  if (enter) st.bk.step = 1;
  $('bk').classList.add('on'); document.body.style.overflow = 'hidden';
  renderBooking(enter);
}
function closeBooking() { const done = st.bk && st.bk.step === 4; st.bk = null; $('bk').classList.remove('on'); $('bk').innerHTML = ''; document.body.style.overflow = ''; if (done) { st.cart = []; renderMain(true); } }
function canNext() {
  const b = st.bk;
  if (b.step === 1) return st.cart.length > 0;
  if (b.step === 2) return !!b.win;
  if (b.step === 3) return st.name.trim().length > 1 && st.phone.replace(/\D/g, '').length >= 10 && !!b.contact && st.agree;
  return true;
}
function windowsFor(day) { const hr = hrNow(); return WINDOWS.map((w) => Object.assign({}, w, { off: day === 0 && w.id !== 'any' && hr + 1 >= w.to })); }
const CONTACTS = { call: 'позвонить', telegram: 'Telegram', max: 'MAX' };
const HANDLE_FIELD = {
  max: ['Ваш ник или ссылка на профиль в MAX', 'ник или ссылка', 'Можно не указывать — найдём вас в MAX по номеру телефона.'] };
const CONTACT_NOTE = {
  telegram: 'После отправки нажмите «Включить уведомления» — откроется наш бот в Telegram. Туда придёт подтверждение и напоминание о записи.',
  max: 'Администратор напишет вам в MAX: подтвердит время и напомнит о записи.',
  call: 'Администратор позвонит, чтобы подтвердить время, и накануне напомнит о записи.' };
function handle() { return st.bk && st.handles[st.bk.contact] ? st.handles[st.bk.contact].trim() : ''; }
function requestText() {
  const b = st.bk, w = WINDOWS.find((x) => x.id === b.win) || {};
  const lines = ['Заявка на запись, ' + S.name, '', ...cartItems().map((s) => '• ' + s.name + ' — ' + s.priceText), 'Итого: ' + (cartHasFrom() ? 'от ' : '') + rub(cartTotal()) + ' ₽', '',
    'Когда: ' + dayLabel(b.day) + ', ' + (w.name || '') + (w.range ? ' (' + w.range + ')' : ''), 'Имя: ' + st.name.trim(), 'Телефон: ' + st.phone.trim(),
    'Как связаться: ' + CONTACTS[b.contact] + (handle() ? ', ' + handle() : '')];
  if (st.comment.trim()) lines.push('Комментарий: ' + st.comment.trim());
  return lines.join('\n');
}
async function sendRequest() {
  const b = st.bk, endpoint = SETTINGS.telegram.endpoint || window.EUPHORIA_ENDPOINT || '';
  const payload = { salon: S.name, services: cartItems().map((s) => ({ id: s.id, name: s.name, price: s.priceText })), total: cartTotal(), totalFrom: cartHasFrom(), day: dayDate(b.day).toISOString().slice(0, 10),
    window: b.win, name: st.name.trim(), phone: st.phone.trim(), contact: b.contact, consent: st.agree === true, handle: handle(), comment: st.comment.trim(), text: requestText(), createdAt: new Date().toISOString() };
  if (endpoint) {
    const r = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('сервер ответил ' + r.status);
    const j = await r.json().catch(() => ({}));
    b.botUrl = j.bot && j.start ? 'https://t.me/' + j.bot + '?start=' + encodeURIComponent(j.start) : '';
    b.sent = 'telegram';
  } else b.sent = 'demo';
}
function renderBooking(enter) {
  const b = st.bk, items = cartItems();
  const openK = new Set([...document.querySelectorAll('#bk details[open]')].map((d) => d.dataset.k));
  const prevBody = document.querySelector('#bk .bk-body'), keepScroll = !enter && prevBody && b._rs === b.step ? prevBody.scrollTop : 0;
  b._rs = b.step;
  let body = '';
  if (b.step === 1) {
    body = items.length ? items.map(priceRow).join('') + '<div class="total"><span>Итого</span><b>' + (cartHasFrom() ? 'от ' : '') + rub(cartTotal()) + ' ₽</b></div>' : '<div class="empty">Добавьте одну или несколько услуг</div>';
    const hasCombo = items.some((s) => s.catKey === 'combo');
    const cross = [...new Set(items.map((s) => DATA.crossSell[s.catKey]).filter((id) => id && !inCart(id) && !(hasCombo && /^cb-|^lz-/.test(id))))].slice(0, 2).map(svc).filter(Boolean);
    if (cross.length) body += '<div class="label caps">С этим часто берут</div>' + cross.map(priceRow).join('');
    if (new Set(items.map((s) => s.catKey)).size >= 2) body += '<div class="note"><b>Можно в 4 руки.</b> Несколько процедур делаем одновременно, если это возможно: администратор подберёт мастеров.</div>';
    body += '<div class="label caps">' + (items.length ? 'Добавить ещё' : 'Выберите услуги') + '</div>' + CATS.map(([k, n]) => '<details class="picker" data-k="' + k + '"' + (openK.has(k) ? ' open' : '') + '><summary><span>' + esc(n) + '</span><small>от ' + rub(catMin(k)) + ' ₽ ▾</small></summary><div class="inner">' + SV.filter((s) => s.catKey === k).map(priceRow).join('') + '</div></details>').join('');
  } else if (b.step === 2) {
    body = '<div class="label caps">День</div><div class="days">' + [0, 1, 2, 3, 4, 5, 6].map((i) => { const d = dayDate(i); return '<button class="day" aria-pressed="' + (b.day === i) + '" data-a="bkDay" data-v="' + i + '"><small>' + (i === 0 ? 'сегодня' : i === 1 ? 'завтра' : SHORT[d.getDay()]) + '</small><b>' + d.getDate() + '</b></button>'; }).join('') + '</div>' +
      '<div class="label caps">Время</div><div class="slots">' + windowsFor(b.day).map((w) => '<button class="slotw" aria-pressed="' + (b.win === w.id) + '" data-a="bkWin" data-v="' + w.id + '"' + (w.off ? ' disabled style="opacity:.35"' : '') + '><b>' + w.name + '</b><small>' + w.range + '</small></button>').join('') + '</div>' +
      '<p class="hint">Точное время администратор согласует с вами по телефону.</p>';
  } else if (b.step === 3) {
    body = '<label class="fld">Имя<input id="fName" autocomplete="given-name" placeholder="Как к вам обращаться" value="' + esc(st.name) + '"></label>' +
      '<label class="fld">Телефон<input id="fPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 900 000-00-00" value="' + esc(st.phone) + '"></label>' +
      '<div class="label caps">Куда прислать подтверждение и напоминание</div><div class="chips" style="padding:0">' + [['telegram', 'Telegram'], ['max', 'MAX'], ['call', 'По телефону']].map(([k, n]) => '<button class="chip" aria-pressed="' + (b.contact === k) + '" data-a="bkContact" data-v="' + k + '">' + n + '</button>').join('') + '</div>' +
      (b.contact ? '<p class="hint">' + CONTACT_NOTE[b.contact] + '</p>' : '<p class="hint" style="color:var(--gold)">Выберите, как с вами связаться, — так мы пришлём подтверждение и напоминание.</p>') +
      (HANDLE_FIELD[b.contact] ? '<label class="fld">' + HANDLE_FIELD[b.contact][0] + '<input id="fHandle" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + HANDLE_FIELD[b.contact][1] + '" value="' + esc(st.handles[b.contact]) + '"></label><p class="hint" style="margin-top:-4px">' + HANDLE_FIELD[b.contact][2] + '</p>' : '') +
      '<label class="fld">Комментарий, если нужно<textarea id="fComment" placeholder="Например: хочу маникюр и педикюр одновременно">' + esc(st.comment) + '</textarea></label>' +
      '<label class="agree"><input type="checkbox" id="fAgree"' + (st.agree ? ' checked' : '') + '><span>Даю <a href="/consent" target="_blank" rel="noopener">согласие на обработку персональных данных</a> для записи и связи со мной</span></label>' +
      '<p class="hint">Без предоплаты. <a href="/privacy" target="_blank" rel="noopener">Политика обработки данных</a></p>';
  } else {
    const w = WINDOWS.find((x) => x.id === b.win) || {};
    body = '<div class="done"><span class="ok">' + I.check.replace('width="16" height="16"', 'width="34" height="34"') + '</span><h3>Заявка отправлена</h3>' + (b.contact === 'telegram' && b.botUrl
        ? '<p><b style="color:var(--ink)">Остался один шаг:</b> откройте бота и нажмите «Начать». Туда придёт подтверждение времени и напоминание.</p><a class="btn-gold" href="' + esc(b.botUrl) + '" target="_blank" rel="noopener">Включить уведомления в Telegram</a>'
        : '<p>Администратор свяжется с вами' + ({ telegram: ' в Telegram', max: ' в MAX', call: ' по телефону' }[b.contact] || '') + ' и подтвердит точное время.</p>') +
      '<div class="note" style="width:100%;text-align:left">' + items.map((s) => esc(s.name)).join('<br>') + '<br><br><b>' + esc(dayLabel(b.day)) + ', ' + esc((w.name || '').toLowerCase()) + '</b> · ' + esc(S.addressShort) + '</div>' +
      '<button class="btn-line" data-a="route">Как добраться</button>' + (b.sent === 'telegram' ? '' : '<span class="hint">Демо-режим: заявка никуда не отправлена</span>') + '</div>';
  }
  $('bk').innerHTML = '<div class="bk-sheet' + (enter ? ' enter' : '') + '"><div class="grab"><span></span></div><div class="bk-head">' +
    (b.step > 1 && b.step < 4 ? '<button class="round" data-a="bkBack" aria-label="Назад">' + I.back + '</button>' : '') +
    '<div class="t"><b>' + TITLES[b.step] + '</b><small>' + (b.step === 4 ? S.name : 'Шаг ' + b.step + ' из 3') + '</small></div><button class="round" data-a="bkClose" aria-label="Закрыть">' + I.x + '</button></div>' +
    '<div class="prog"><i style="width:' + Math.min(b.step, 3) / 3 * 100 + '%"></i></div><div class="bk-body">' + body + '</div>' +
    '<div class="bk-foot"><button id="bkNext" data-a="bkNext"' + (canNext() ? '' : ' disabled') + '>' + (b.step === 3 ? 'Отправить заявку' : b.step === 4 ? 'Готово' : 'Далее') + '</button></div></div>';
  if (keepScroll) document.querySelector('#bk .bk-body').scrollTop = keepScroll;
}
async function bkNext() {
  const b = st.bk; if (!canNext()) return;
  if (b.step === 4) return closeBooking();
  if (b.step === 3) {
    const btn = $('bkNext'); btn.disabled = true; btn.textContent = 'Отправляем…';
    try { await sendRequest(); } catch (e) { btn.disabled = false; btn.textContent = 'Отправить заявку'; return toast('Не удалось отправить: ' + e.message + '. Позвоните нам, пожалуйста.'); }
  }
  b.step++;
  renderBooking();
}

/* ====== СОБЫТИЯ ====== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, b = st.bk;
  const routeUrl = 'https://yandex.ru/maps/?rtext=~' + encodeURIComponent(S.address) + '&rtt=auto';
  switch (a) {
    case 'tab': st.tab = v; renderMain(true); if (v !== 'overview') document.querySelector('.tabs').scrollIntoView({ block: 'start' }); break;
    case 'cat': st.cat = v; renderMain(true); break;
    case 'openCat': st.tab = 'services'; st.cat = v; renderMain(true); document.querySelector('.tabs').scrollIntoView({ block: 'start' }); break;
    case 'hours': st.hoursOpen = !st.hoursOpen; renderMain(true); break;
    case 'heroPrev': heroGo(-1); break;
    case 'heroNext': heroGo(1); break;
    case 'showPhone': st.phoneShown = true; renderMain(true); break;
    case 'call': location.href = 'tel:' + S.phone.replace(/[^\d+]/g, ''); break;
    case 'route': window.open(routeUrl, '_blank', 'noopener'); break;
    case 'copy': (navigator.clipboard ? navigator.clipboard.writeText(S.address) : Promise.reject()).then(() => toast('Адрес скопирован'), () => toast(S.address)); break;
    case 'share': if (navigator.share) navigator.share({ title: S.name, text: S.categories, url: location.href }).catch(() => {}); else toast('Ссылка скопирована'); break;
    case 'tg': if (S.telegram) window.open(S.telegram, '_blank', 'noopener'); else toast('Здесь откроется чат в Telegram'); break;
    case 'toast': toast(v); break;
    case 'cart': toggleCart(v); break;
    case 'book': openBooking(true); break;
    case 'bookWith': if (!inCart(v)) st.cart.push(v); renderMain(true); openBooking(true); break;
    case 'story': openStory(Number(v)); break;
    case 'storyClose': closeStory(); break;
    case 'storyPrev': openStory(st.story - 1); break;
    case 'storyNext': openStory(st.story + 1); break;
    case 'bkClose': closeBooking(); break;
    case 'bkBack': b.step = Math.max(1, b.step - 1); renderBooking(); break;
    case 'bkDay': b.day = Number(v); if (b.win && windowsFor(b.day).find((w) => w.id === b.win).off) b.win = null; renderBooking(); break;
    case 'bkWin': b.win = v; renderBooking(); break;
    case 'bkContact': b.contact = v; renderBooking(); break;
    case 'bkNext': bkNext(); break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'fName') st.name = e.target.value;
  if (e.target.id === 'fPhone') st.phone = e.target.value;
  if (e.target.id === 'fComment') st.comment = e.target.value;
  if (e.target.id === 'fAgree') st.agree = e.target.checked;
  if (e.target.id === 'fHandle' && st.bk) st.handles[st.bk.contact] = e.target.value;
  const n = $('bkNext'); if (n && st.bk) n.disabled = !canNext();
});
$('bk').addEventListener('click', (e) => { if (e.target.id === 'bk') closeBooking(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (st.bk) closeBooking(); else if (st.story >= 0) closeStory(); }
  if (st.story >= 0 && e.key === 'ArrowRight') openStory(st.story + 1);
  if (st.story >= 0 && e.key === 'ArrowLeft') openStory(st.story - 1);
});
renderMain();
</script>
</body>
</html>
